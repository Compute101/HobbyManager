<script type="module">
  import { loadData, exportJSON, importJSON, appData, getAllModelTypes, deleteCustomModelType, BUILTIN_MODEL_TYPES, createFolder, driveSync, replaceData } from './js/data.js';
  import { isConfigured, isConnected, wasConnected, getSavedEmail, getLastSyncTime, init as gDriveInit, connect as gDriveConnect, disconnect as gDriveDisconnect, loadFromDrive, saveToDrive } from './js/gdrive.js';
  import { renderModelPool, showModelForm, showModelTypeEditor } from './js/models.js';
  import { renderCollections } from './js/collections.js';
  import { renderRoadmap } from './js/roadmap.js';
  import { renderDashboard } from './js/dashboard.js';
  import { renderQueues } from './js/queue.js';
  import { renderActivity } from './js/activity.js';
  import { loadSavedTheme, applyTheme } from './js/theme.js';
  import { toast, showModal, closeModal, showConfirm } from './js/ui.js';
  import { renderQuartermaster, pileCount, pileWorth, rectitudePct } from './js/quartermaster.js';

  // --- Boot ---
  loadData();
  loadSavedTheme();

  // --- Drive sync ---
  let _driveSyncTimer = null;
  driveSync.callback = data => {
    if (isConnected()) {
      clearTimeout(_driveSyncTimer);
      _driveSyncTimer = setTimeout(() =>
        saveToDrive(data).catch(e => {
          if (e.message === 'Token expired')
            toast('Google Drive disconnected — reconnect in Settings', 'warning', 5000);
        }), 2000);
    }
  };
  if (isConfigured()) gDriveInit().catch(() => {});

  // --- Tab switching ---
  const tabs = document.querySelectorAll('.nav-tab');
  const panels = document.querySelectorAll('.tab-panel');

  function switchTab(tabId) {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tabId));
    panels.forEach(p => p.classList.toggle('active', p.id === `tab-${tabId}`));

    // Render panel content
    if (tabId === 'dashboard') renderDashboard();
    if (tabId === 'pool') renderModelPool();
    if (tabId === 'collections') renderCollections();
    if (tabId === 'roadmap') renderRoadmap();
    if (tabId === 'queues') renderQueues();
    if (tabId === 'activity') renderActivity();
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });

  // --- Settings button (now in header as modal) ---
  document.getElementById('settingsBtn').addEventListener('click', () => {
    const content = document.createElement('div');
    content.id = 'settingsView';
    showModal({ title: '⚙️ Settings', content, wide: false });
    renderSettings(content);
  });
  // --- Quartermaster's Office (modal, not a tab — always reminds before entering) ---
  document.getElementById('quartermasterBtn').addEventListener('click', () => {
    const count = pileCount();
    const worth = pileWorth();
    const rect = rectitudePct();
    showConfirm({
      message: `You currently have <b>${count}</b> model${count !== 1 ? 's' : ''} on the pile, worth <b>£${worth.toFixed(0)}</b>.` +
        (rect === null ? '' : ` Rectitude: <b>${Math.round(rect)}%</b>.`),
      confirmLabel: 'Enter',
      onConfirm: () => {
        const content = document.createElement('div');
        content.id = 'qmView';
        showModal({ title: "🎖️ Quartermaster's Office", content, wide: true });
        renderQuartermaster(content);
      }
    });
  });

  document.getElementById('addModelBtn').addEventListener('click', () => showModelForm());
  document.getElementById('addFolderBtn').addEventListener('click', () => {
    const name = prompt('Folder name:');
    if (name?.trim()) {
      createFolder(name.trim());
      renderModelPool();
    }
  });

  // --- Export / Import ---
  document.getElementById('exportBtn').addEventListener('click', exportJSON);
  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      await importJSON(file);
      switchTab('dashboard');
    } catch (err) {
      alert('Import failed: ' + err.message);
    }
    e.target.value = '';
  });

  // --- Google Drive helpers ---

  function _formatSyncTime(isoStr) {
    if (!isoStr) return 'Never';
    const diff = Date.now() - new Date(isoStr).getTime();
    if (diff < 60000)      return 'Just now';
    if (diff < 3600000)    return `${Math.floor(diff / 60000)} min ago`;
    if (diff < 86400000)   return `${Math.floor(diff / 3600000)}h ago`;
    return new Date(isoStr).toLocaleDateString();
  }

  async function _handleGDriveConnect() {
    const btn = document.querySelector('#gdriveConnectBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Connecting…'; }
    try {
      await gDriveInit();
      await gDriveConnect();
      let driveResult = null;
      try { driveResult = await loadFromDrive(); } catch {}
      const rawLocal  = localStorage.getItem('hobbymanager_v2');
      const localData = rawLocal ? JSON.parse(rawLocal) : {};
      const hasLocal  = Object.keys(localData.models || {}).length > 0;

      if (driveResult && hasLocal) {
        await _showDataConflictDialog(driveResult, localData);
      } else if (!driveResult && hasLocal) {
        await _showUploadDialog(localData);
      } else if (driveResult && !hasLocal) {
        replaceData(driveResult.data);
        applyTheme(appData.config.activeTheme);
        switchTab('dashboard');
        toast('Data loaded from Google Drive', 'success');
      } else {
        toast('Connected to Google Drive', 'success');
      }
      renderSettings();
    } catch (err) {
      if (err.message !== 'popup_closed_by_user') toast('Could not connect: ' + err.message, 'error');
      if (btn) { btn.disabled = false; btn.textContent = wasConnected() ? 'Reconnect' : 'Connect'; }
    }
  }

  async function _handleGDriveDisconnect() {
    if (!confirm('Disconnect Google Drive? Your data will stay on this device.')) return;
    gDriveDisconnect();
    toast('Disconnected from Google Drive', 'info');
    renderSettings();
  }

  async function _handleGDriveSyncNow() {
    const btn = document.querySelector('#gdriveSyncNowBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Syncing…'; }
    try {
      const data = JSON.parse(localStorage.getItem('hobbymanager_v2') || '{}');
      await saveToDrive(data);
      toast('Synced to Google Drive', 'success');
      renderSettings();
    } catch (err) {
      toast('Sync failed: ' + err.message, 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Sync Now'; }
    }
  }

  function _showUploadDialog(localData) {
    return new Promise(resolve => {
      const count = Object.keys(localData.models || {}).length;
      const content = document.createElement('div');
      content.innerHTML = `
        <p style="margin:0 0 0.75em">Would you like to upload your existing data to Google Drive?</p>
        <p style="margin:0 0 1.5em;color:var(--text-muted)">${count} model${count !== 1 ? 's' : ''} will be backed up. Future changes sync automatically.</p>
        <div class="modal-actions">
          <button class="btn btn-primary" id="driveUploadYes">Upload to Drive</button>
          <button class="btn" id="driveUploadNo">Skip for now</button>
        </div>
      `;
      content.querySelector('#driveUploadYes').addEventListener('click', async () => {
        closeModal();
        try {
          await saveToDrive(JSON.parse(localStorage.getItem('hobbymanager_v2') || '{}'));
          toast('Data backed up to Google Drive', 'success');
        } catch (e) { toast('Upload failed: ' + e.message, 'error'); }
        resolve();
      });
      content.querySelector('#driveUploadNo').addEventListener('click', () => {
        closeModal();
        toast('Connected — future changes will sync to Drive', 'info');
        resolve();
      });
      showModal({ title: 'Back Up to Google Drive?', content });
    });
  }

  function _showDataConflictDialog(driveResult, localData) {
    return new Promise(resolve => {
      const localCount = Object.keys(localData.models || {}).length;
      const driveCount = Object.keys(driveResult.data.models || {}).length;
      const driveDate  = driveResult.modifiedTime
        ? new Date(driveResult.modifiedTime).toLocaleDateString() : 'unknown date';
      const content = document.createElement('div');
      content.innerHTML = `
        <p style="margin:0 0 1em">Found hobby data in both places — which would you like to keep?</p>
        <div style="display:grid;gap:0.5em;margin-bottom:1.5em">
          <div style="padding:0.75em;border:1px solid var(--border);border-radius:var(--radius)">
            <strong>📱 This device</strong>
            <div style="color:var(--text-muted);font-size:0.85em;margin-top:0.2em">${localCount} model${localCount !== 1 ? 's' : ''}</div>
          </div>
          <div style="padding:0.75em;border:1px solid var(--border);border-radius:var(--radius)">
            <strong>☁️ Google Drive</strong>
            <div style="color:var(--text-muted);font-size:0.85em;margin-top:0.2em">${driveCount} model${driveCount !== 1 ? 's' : ''} · saved ${driveDate}</div>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:0.5em">
          <button class="btn btn-primary" id="conflictKeepLocal">Keep local data &amp; upload to Drive</button>
          <button class="btn" id="conflictUseDrive">Use Drive data on this device</button>
        </div>
      `;
      content.querySelector('#conflictKeepLocal').addEventListener('click', async () => {
        closeModal();
        try {
          await saveToDrive(JSON.parse(localStorage.getItem('hobbymanager_v2') || '{}'));
          toast('Local data uploaded to Google Drive', 'success');
        } catch (e) { toast('Upload failed: ' + e.message, 'error'); }
        resolve();
      });
      content.querySelector('#conflictUseDrive').addEventListener('click', () => {
        closeModal();
        replaceData(driveResult.data);
        applyTheme(appData.config.activeTheme);
        switchTab('dashboard');
        toast('Data loaded from Google Drive', 'success');
        resolve();
      });
      showModal({ title: 'Choose Your Data', content });
    });
  }

  function renderSettings(container) {
    container = container || document.getElementById('settingsView');
    if (!container) return;

    const customTypes = getAllModelTypes().filter(t => !t.builtIn);

    container.innerHTML = `
      <div class="settings-section">
        <h3>Weekly Goal</h3>
        <div class="settings-row">
          <div>
            <div class="settings-row-label">Hobby points target per week</div>
            <div class="settings-row-desc">Set to 0 to disable</div>
          </div>
          <input type="number" id="weeklyGoalInput" class="form-input" min="0" 
            style="width:80px" value="${appData.config.weeklyGoal || 0}">
        </div>
      </div>
      <div class="settings-section">
        <h3>Appearance</h3>
        <div class="settings-row">
          <div>
            <div class="settings-row-label">Theme</div>
            <div class="settings-row-desc">Choose your preferred visual style</div>
          </div>
          <select class="form-input settings-theme-select" id="themeSelect" style="width:auto">
            <option value="theme-default" ${(appData.config.activeTheme || 'theme-default') === 'theme-default' ? 'selected' : ''}>Default</option>
            <option value="theme-old-world" ${appData.config.activeTheme === 'theme-old-world' ? 'selected' : ''}>⚔️ Old World</option>
            <option value="theme-40k" ${appData.config.activeTheme === 'theme-40k' ? 'selected' : ''}>💀 40K</option>
            <option value="theme-heresy" ${appData.config.activeTheme === 'theme-heresy' ? 'selected' : ''}>🔱 Horus Heresy</option>
            <option value="theme-aos" ${appData.config.activeTheme === 'theme-aos' ? 'selected' : ''}>✨ Age of Sigmar</option>
          </select>
        </div>
      </div>
      <div class="settings-section">
        <h3>Standard Model Type Templates</h3>
        <p class="settings-row-desc" style="margin-bottom:0.75em">Edit the default stages and hobby points for each built-in model type. New models of that type will use your settings; existing models are unaffected.</p>
        <div class="custom-types-list">
          ${BUILTIN_MODEL_TYPES.map(t => {
            const overrides = appData.config.modelTypeOverrides || {};
            const effectiveStages = overrides[t.id] ? overrides[t.id] : t.stages;
            const totalPts = effectiveStages.reduce((a, s) => a + s.points, 0);
            const isCustomised = !!overrides[t.id];
            return `
              <div class="settings-row">
                <div>
                  <div class="settings-row-label">${t.name}${isCustomised ? ' <span class="type-customised-badge">customised</span>' : ''}</div>
                  <div class="settings-row-desc">${effectiveStages.length} stages · ${totalPts} total pts</div>
                </div>
                <button class="btn btn-sm" data-edit-builtin="${t.id}">✏️ Edit</button>
              </div>
            `;
          }).join('')}
        </div>
      </div>
      <div class="settings-section">
        <h3>Custom Model Types</h3>
        ${customTypes.length ? `
          <div class="custom-types-list">
            ${customTypes.map(t => `
              <div class="settings-row">
                <div>
                  <div class="settings-row-label">⭐ ${t.name}</div>
                  <div class="settings-row-desc">${t.stages.length} stages · ${t.stages.reduce((a,s) => a + s.points, 0)} total pts</div>
                </div>
                <button class="btn btn-sm btn-danger" data-delete-type="${t.id}">🗑️ Delete</button>
              </div>
            `).join('')}
          </div>
        ` : '<p class="empty-text" style="padding:0.5em 0">No custom types yet. Save one from the Add Model form.</p>'}
      </div>
      <div class="settings-section">
        <h3>Photos</h3>
        <div class="settings-row">
          <div>
            <div class="settings-row-label">Thumbnail quality</div>
            <div class="settings-row-desc">Applied when you upload a new photo. Existing photos are unaffected.</div>
          </div>
          <select class="form-input" id="imageSizeSelect" style="width:auto">
            <option value="small"  ${(appData.config.imageSize || 'small') === 'small'  ? 'selected' : ''}>Small (~3 KB)</option>
            <option value="medium" ${appData.config.imageSize === 'medium' ? 'selected' : ''}>Medium (~9 KB)</option>
            <option value="large"  ${appData.config.imageSize === 'large'  ? 'selected' : ''}>Large (~30 KB)</option>
          </select>
        </div>
      </div>
      <div class="settings-section">
        <h3>Data Management</h3>
        <div class="settings-row" style="flex-direction:column;align-items:stretch;gap:0.4em">
          <div class="settings-row-label">Storage used</div>
          ${(() => {
            let used = 0;
            for (const key in localStorage) {
              if (Object.prototype.hasOwnProperty.call(localStorage, key)) {
                used += (localStorage[key].length + key.length) * 2;
              }
            }
            const limit = 5 * 1024 * 1024;
            const pct = Math.min(100, Math.round(used / limit * 100));
            const usedKB = (used / 1024).toFixed(0);
            return `
              <div class="storage-bar-wrap">
                <div class="storage-bar" style="width:${pct}%"></div>
              </div>
              <div class="settings-row-desc">${usedKB} KB of ~5 MB used (${pct}%)</div>
            `;
          })()}
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-row-label">Export Data</div>
            <div class="settings-row-desc">Download a backup JSON file</div>
          </div>
          <button class="btn btn-sm" id="settingsExport">💾 Export</button>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-row-label">Import Data</div>
            <div class="settings-row-desc">Restore from a backup JSON file</div>
          </div>
          <button class="btn btn-sm" id="settingsImport">📂 Import</button>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-row-label">Clear All Data</div>
            <div class="settings-row-desc">⚠️ This cannot be undone</div>
          </div>
          <button class="btn btn-sm btn-danger" id="settingsClear">🗑️ Clear</button>
        </div>
      </div>
      <div class="settings-section">
        <h3>Cloud Sync</h3>
        ${!isConfigured() ? `
          <div class="settings-row">
            <div>
              <div class="settings-row-label">Google Drive</div>
              <div class="settings-row-desc">Not configured — set <code>GOOGLE_CLIENT_ID</code> in <code>js/gdrive.js</code> to enable.</div>
            </div>
          </div>
        ` : isConnected() ? `
          <div class="settings-row">
            <div>
              <div class="settings-row-label">
                <span style="display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;margin-right:6px;vertical-align:middle"></span>
                Google Drive Connected
              </div>
              <div class="settings-row-desc">Signed in as ${getSavedEmail()}</div>
            </div>
            <button class="btn btn-sm btn-danger" id="gdriveDisconnectBtn">Disconnect</button>
          </div>
          <div class="settings-row">
            <div>
              <div class="settings-row-label">Auto-sync on</div>
              <div class="settings-row-desc">Last synced: ${_formatSyncTime(getLastSyncTime())}</div>
            </div>
            <button class="btn btn-sm" id="gdriveSyncNowBtn">Sync Now</button>
          </div>
        ` : `
          <div class="settings-row">
            <div>
              <div class="settings-row-label">Google Drive</div>
              <div class="settings-row-desc">${wasConnected()
                ? `Last connected as <strong>${getSavedEmail()}</strong> — reconnect to resume syncing`
                : 'Back up and sync your data across devices'}</div>
            </div>
            <button class="btn btn-sm" id="gdriveConnectBtn">${wasConnected() ? 'Reconnect' : 'Connect'}</button>
          </div>
        `}
      </div>
      <div class="settings-section">
        <h3>About</h3>
        <div class="settings-row">
          <div>
            <div class="settings-row-label">Hobby Manager</div>
            <div class="settings-row-desc">Track your miniature painting progress. Data stored locally; optionally synced to Google Drive.</div>
          </div>
        </div>
      </div>
    `;

    container.querySelector('#weeklyGoalInput')?.addEventListener('change', e => {
      appData.config.weeklyGoal = Math.max(0, parseInt(e.target.value) || 0);
      saveData();
      toast('Weekly goal saved!', 'success');
    });

    container.querySelector('#themeSelect')?.addEventListener('change', e => {
      applyTheme(e.target.value);
      toast('Theme saved!', 'success');
    });

    container.querySelector('#imageSizeSelect')?.addEventListener('change', e => {
      appData.config.imageSize = e.target.value;
      saveData();
      toast('Photo quality saved!', 'success');
    });

    container.querySelectorAll('[data-edit-builtin]').forEach(btn => {
      btn.addEventListener('click', () => {
        showModelTypeEditor(btn.dataset.editBuiltin, () => renderSettings());
      });
    });

    container.querySelectorAll('[data-delete-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = getAllModelTypes().find(t => t.id === btn.dataset.deleteType);
        if (!t) return;
        if (!confirm(`Delete custom type "${t.name}"?`)) return;
        deleteCustomModelType(t.id);
        toast('Custom type deleted', 'info');
        renderSettings();
      });
    });

    container.querySelector('#settingsExport').addEventListener('click', exportJSON);
    container.querySelector('#settingsImport').addEventListener('click', () => document.getElementById('importFile').click());
    container.querySelector('#settingsClear').addEventListener('click', () => {
      if (!confirm('Delete ALL data permanently?')) return;
      localStorage.removeItem('hobbymanager_v2');
      location.reload();
    });

    container.querySelector('#gdriveConnectBtn')?.addEventListener('click', _handleGDriveConnect);
    container.querySelector('#gdriveDisconnectBtn')?.addEventListener('click', _handleGDriveDisconnect);
    container.querySelector('#gdriveSyncNowBtn')?.addEventListener('click', _handleGDriveSyncNow);
  }

  // --- Initial render ---
  renderDashboard();
</script>

</body>
</html>
