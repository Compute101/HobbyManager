<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hobby Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=MedievalSharp&family=Rajdhani:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>

    /* ================================================================
       CSS CUSTOM PROPERTIES — Default Theme
    ================================================================ */
    :root {
      --bg:           #1a1a2e;
      --bg2:          #16213e;
      --bg3:          #0f3460;
      --surface:      #1e2140;
      --surface2:     #252847;
      --border:       #2e3260;
      --text:         #e0e0f0;
      --text-muted:   #8888aa;
      --accent:       #4a9d6f;
      --accent2:      #c5a028;
      --danger:       #c0392b;
      --warning:      #e67e22;
      --font-display: 'Cinzel', serif;
      --font-body:    'Crimson Text', serif;
      --font-ui:      system-ui, sans-serif;
      --radius:       6px;
      --chart-done:   #4a9d6f;
      --chart-remain: #2a2a40;
      --header-bg:    linear-gradient(135deg, #0f3460 0%, #16213e 100%);
      --tab-active-bg:#1e2140;
      /* Pictogram model-group colors — fixed categorical order, validated for
         CVD-safe adjacent contrast against this app's dark surfaces. */
      --grp-infantry:   #3987e5;
      --grp-mounted:    #d95926;
      --grp-large:      #199e70;
      --grp-characters: #c98500;
      --grp-vehicles:   #d55181;
      --grp-special:    #008300;
      --grp-custom:     #9085e9;
      --grp-other:      #e66767;
    }

    /* ================================================================
       OLD WORLD THEME — Parchment, heraldry, gothic
    ================================================================ */
    .theme-old-world {
      --bg:           #1c1509;
      --bg2:          #231a0a;
      --bg3:          #2e1f0d;
      --surface:      #2a1e0f;
      --surface2:     #352614;
      --border:       #5c4020;
      --text:         #f0e4c4;
      --text-muted:   #a08060;
      --accent:       #c8962a;
      --accent2:      #8b2222;
      --danger:       #8b1a1a;
      --warning:      #b87820;
      --font-display: 'Cinzel', serif;
      --font-body:    'Crimson Text', serif;
      --chart-done:   #c8962a;
      --chart-remain: #2a1e0f;
      --header-bg:    linear-gradient(135deg, #2e1f0d 0%, #1c1509 100%);
      --tab-active-bg:#2a1e0f;
    }

    .theme-old-world header::after {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c8962a' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }

    .theme-old-world .app-title {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.08em;
    }

    .theme-old-world .btn-primary {
      background: linear-gradient(135deg, #c8962a, #a07020);
      border: 1px solid #daa84a;
      color: #1c1509;
      font-weight: 700;
    }

    .theme-old-world .model-card,
    .theme-old-world .list-card,
    .theme-old-world .dash-card {
      border: 1px solid #5c4020;
      background: linear-gradient(160deg, #2a1e0f 0%, #231a0a 100%);
    }

    .theme-old-world .model-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c8962a, transparent);
    }

    .theme-old-world .prog-fill { background: #c8962a; }
    .theme-old-world .nav-tab.active { border-bottom-color: #c8962a; color: #c8962a; }

    /* ================================================================
       40K THEME — Grimdark steel, industrial, red accents
    ================================================================ */
    .theme-40k {
      --bg:           #0d0d0f;
      --bg2:          #111115;
      --bg3:          #1a0808;
      --surface:      #141418;
      --surface2:     #1c1c22;
      --border:       #2a1010;
      --text:         #d0ccc0;
      --text-muted:   #706860;
      --accent:       #c0180c;
      --accent2:      #8a6a28;
      --danger:       #8a0808;
      --warning:      #b86010;
      --font-display: 'Rajdhani', sans-serif;
      --font-body:    'Rajdhani', sans-serif;
      --chart-done:   #c0180c;
      --chart-remain: #1a1a1a;
      --header-bg:    linear-gradient(135deg, #1a0808 0%, #0d0d0f 100%);
      --tab-active-bg:#141418;
    }

    .theme-40k header {
      border-bottom: 2px solid #c0180c;
    }

    .theme-40k .app-title {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .theme-40k .btn-primary {
      background: linear-gradient(135deg, #c0180c, #8a0808);
      border: 1px solid #e02010;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .theme-40k .model-card,
    .theme-40k .list-card,
    .theme-40k .dash-card {
      border: 1px solid #2a1010;
      border-left: 3px solid #c0180c;
    }

    .theme-40k .prog-fill { background: #c0180c; }
    .theme-40k .nav-tab.active { border-bottom-color: #c0180c; color: #c0180c; }

    /* ================================================================
       HORUS HERESY THEME — Palatine gold, iron grey, gothic grandeur
    ================================================================ */
    .theme-heresy {
      --bg:           #0e0e10;
      --bg2:          #131318;
      --bg3:          #1a1408;
      --surface:      #161618;
      --surface2:     #1e1e22;
      --border:       #2a2010;
      --text:         #d8d0c0;
      --text-muted:   #706858;
      --accent:       #b8922a;
      --accent2:      #6a6a7a;
      --danger:       #8a1010;
      --warning:      #a06010;
      --font-display: 'Cinzel', serif;
      --font-body:    'Crimson Text', serif;
      --chart-done:   #b8922a;
      --chart-remain: #1a1a1a;
      --header-bg:    linear-gradient(135deg, #1a1408 0%, #0e0e10 100%);
      --tab-active-bg:#161618;
    }

    .theme-heresy header {
      border-bottom: 2px solid #b8922a;
    }

    .theme-heresy .app-title {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.08em;
    }

    .theme-heresy .btn-primary {
      background: linear-gradient(135deg, #b8922a, #8a6a18);
      border: 1px solid #d4aa40;
      color: #0e0e10;
      font-weight: 700;
    }

    .theme-heresy .model-card,
    .theme-heresy .list-card,
    .theme-heresy .dash-card {
      border: 1px solid #2a2010;
      border-left: 3px solid #b8922a;
    }

    .theme-heresy .prog-fill { background: #b8922a; }
    .theme-heresy .nav-tab.active { border-bottom-color: #b8922a; color: #b8922a; }

    /* ================================================================
       AGE OF SIGMAR THEME — Arcane purple, celestial gold, magical
    ================================================================ */
    .theme-aos {
      --bg:           #0d0b14;
      --bg2:          #110f1a;
      --bg3:          #1a1228;
      --surface:      #151020;
      --surface2:     #1c1630;
      --border:       #2e2050;
      --text:         #e0d8f0;
      --text-muted:   #8070a0;
      --accent:       #9060d0;
      --accent2:      #c8a030;
      --danger:       #8a1040;
      --warning:      #a06020;
      --font-display: 'Cinzel', serif;
      --font-body:    'Crimson Text', serif;
      --chart-done:   #9060d0;
      --chart-remain: #1a1228;
      --header-bg:    linear-gradient(135deg, #1a1228 0%, #0d0b14 100%);
      --tab-active-bg:#151020;
    }

    .theme-aos header {
      border-bottom: 2px solid #9060d0;
    }

    .theme-aos .app-title {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.06em;
    }

    .theme-aos .btn-primary {
      background: linear-gradient(135deg, #9060d0, #6040a0);
      border: 1px solid #a870e0;
      color: #fff;
      font-weight: 600;
    }

    .theme-aos .model-card,
    .theme-aos .list-card,
    .theme-aos .dash-card {
      border: 1px solid #2e2050;
      background: linear-gradient(160deg, #151020 0%, #110f1a 100%);
    }

    .theme-aos .model-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #9060d0, transparent);
    }

    .theme-aos .prog-fill { background: #9060d0; }
    .theme-aos .nav-tab.active { border-bottom-color: #9060d0; color: #9060d0; }

    .theme-aos .sys-tag.theme-aos { border-color: #9060d044; color: #9060d0; }
    .theme-heresy .sys-tag.theme-heresy { border-color: #b8922a44; color: #b8922a; }

    /* ================================================================
       BASE STYLES
    ================================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ================================================================
       LAYOUT
    ================================================================ */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      background: var(--header-bg);
      padding: 0.8em 1em;
      display: flex;
      align-items: center;
      gap: 0.75em;
      position: relative;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      transition: background 0.4s ease;
    }

    .app-title {
      font-family: var(--font-display);
      font-size: 1.15em;
      font-weight: 600;
      color: var(--text);
      flex: 1;
      letter-spacing: 0.04em;
    }

    .header-actions {
      display: flex;
      gap: 0.4em;
      align-items: center;
    }

    .system-badge {
      font-size: 0.7em;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--font-ui);
    }

    .system-badge.theme-old-world { border-color: #c8962a; color: #c8962a; }
    .system-badge.theme-40k { border-color: #c0180c; color: #c0180c; }
    .system-badge.theme-heresy { border-color: #b8922a; color: #b8922a; }
    .system-badge.theme-aos { border-color: #9060d0; color: #9060d0; }

    /* ================================================================
       NAV TABS
    ================================================================ */
    .nav-tabs {
      display: flex;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .nav-tab {
      flex: 1;
      padding: 0.75em 0.25em;
      text-align: center;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 0.78em;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .nav-tab .tab-icon { font-size: 1.3em; }
    .nav-tab .tab-label { font-size: 0.8em; }

    .nav-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: var(--tab-active-bg);
    }

    .nav-tab:hover:not(.active) { color: var(--text); }

    /* ================================================================
       MAIN CONTENT
    ================================================================ */
    .tab-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tab-panel {
      display: none;
      padding: 1em;
      min-height: 100%;
    }

    .tab-panel.active { display: block; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1em;
      gap: 0.5em;
    }

    .panel-header h2 {
      font-family: var(--font-display);
      font-size: 1.1em;
      font-weight: 600;
    }

    /* ================================================================
       BUTTONS
    ================================================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3em;
      padding: 0.45em 0.9em;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.9em;
      font-family: var(--font-ui);
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }

    .btn:hover { opacity: 0.85; }
    .btn:active { opacity: 0.7; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, black));
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn-sm { padding: 0.3em 0.6em; font-size: 0.82em; }
    .btn-xs { padding: 0.2em 0.4em; font-size: 0.75em; }

    /* ================================================================
       FORMS
    ================================================================ */
    .form-group { margin-bottom: 1em; }
    .form-group label { display: block; font-size: 0.85em; color: var(--text-muted); margin-bottom: 0.3em; font-family: var(--font-ui); }

    .form-input {
      width: 100%;
      padding: 0.55em 0.75em;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95em;
      font-family: var(--font-ui);
      transition: border-color 0.2s;
    }

    .form-input:focus { outline: none; border-color: var(--accent); }
    textarea.form-input { resize: vertical; min-height: 60px; }

    /* ================================================================
       PROGRESS BAR
    ================================================================ */
    .prog-bar {
      background: var(--surface2);
      border-radius: 100px;
      overflow: hidden;
      height: 8px;
      margin: 0.4em 0;
    }

    .prog-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 100px;
      transition: width 0.5s ease;
    }

    /* ================================================================
       BADGES
    ================================================================ */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25em;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 0.75em;
      font-family: var(--font-ui);
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-table  { background: #3a2a1a; color: #c8962a; border: 1px solid #c8962a44; }
    .badge-painted { background: #1a2e20; color: #4a9d6f; border: 1px solid #4a9d6f44; }
    .badge-finished { background: #2a2810; color: #c5a028; border: 1px solid #c5a02844; }
    .badge-wip         { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
    .badge-not-started { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); opacity: 0.6; }

    /* ================================================================
       MODEL GRID / CARDS
    ================================================================ */
    .model-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.75em;
    }

    .model-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9em;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }

    .model-card:hover { border-color: var(--accent); transform: translateY(-1px); }

    .model-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5em;
      gap: 0.5em;
    }

    .model-card-name {
      font-family: var(--font-display);
      font-size: 0.95em;
      font-weight: 600;
      line-height: 1.3;
    }

    .model-card-qty { font-size: 0.8em; color: var(--text-muted); }
    .model-card-pts { font-size: 0.8em; color: var(--text-muted); margin-top: 0.3em; }

    .model-card-actions {
      display: flex;
      gap: 0.4em;
      margin-top: 0.7em;
      flex-wrap: wrap;
    }

    .model-card-thumb {
      display: block;
      width: calc(100% + 1.8em);
      height: 72px;
      object-fit: cover;
      margin: -0.9em -0.9em 0.75em -0.9em;
      border-radius: calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;
    }

    .detail-image {
      display: block;
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      border-radius: var(--radius);
      background: var(--surface2);
      margin-bottom: 0.75em;
    }

    .img-upload-area {
      background: var(--surface2);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 0.5em;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .img-upload-preview {
      display: block;
      width: 100%;
      max-height: 160px;
      object-fit: contain;
    }

    .img-upload-placeholder {
      color: var(--text-muted);
      font-size: 0.85em;
      padding: 1em;
    }

    .img-upload-actions { display: flex; gap: 0.5em; margin-bottom: 0.3em; }
    .img-upload-info { font-size: 0.75em; color: var(--text-muted); }

    .storage-bar-wrap {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
      margin: 0.3em 0 0.2em;
    }
    .storage-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.3s;
      min-width: 2px;
    }

    /* ================================================================
       STAGE ROWS
    ================================================================ */
    .stages-list { margin: 0.75em 0; }

    .stage-row {
      padding: 0.4em 0;
      border-bottom: 1px solid var(--border);
    }

    .stage-row:last-child { border-bottom: none; }
    .stage-row.stage-skipped { opacity: 0.4; }

    .stage-row-info {
      display: flex;
      align-items: center;
      gap: 0.5em;
      margin-bottom: 0.2em;
    }

    .stage-name { font-size: 0.9em; font-weight: 600; flex: 1; }
    .stage-opt  { font-size: 0.72em; color: var(--text-muted); font-style: italic; }
    .stage-count { font-size: 0.8em; color: var(--text-muted); }

    /* Stage config form */
    .stages-config { display: flex; flex-direction: column; gap: 0.4em; margin-bottom: 0.5em; }

    .stage-config-row {
      display: flex;
      gap: 0.4em;
      align-items: center;
      flex-wrap: wrap;
    }

    .stage-config-row .form-input { width: auto; flex: 1; min-width: 70px; }
    .stage-cfg-pts { max-width: 55px !important; flex: 0 !important; }
    .stage-cfg-milestone { max-width: 130px !important; flex: 0 1 130px !important; font-size: 0.8em !important; padding: 0.3em 0.4em !important; }
    .stage-cfg-skip, .stage-cfg-crew { display: flex; align-items: center; gap: 0.3em; font-size: 0.8em; color: var(--text-muted); white-space: nowrap; }
    .stage-cfg-skip input, .stage-cfg-crew input { width: auto; }
    .stages-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.4em; }
    .stages-actions-row { display: flex; gap: 0.5em; margin-top: 0.5em; }
    .pts-detail { font-size: 0.85em; color: var(--text-muted); }

    /* ================================================================
       LOG PROGRESS
    ================================================================ */
    .log-model-name { font-family: var(--font-display); font-size: 1.05em; margin-bottom: 0.75em; }
    .log-qty { font-size: 0.8em; color: var(--text-muted); }

    .log-stages { display: flex; flex-direction: column; gap: 0.6em; }

    .log-stage-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75em;
      padding: 0.5em;
      background: var(--surface2);
      border-radius: var(--radius);
      flex-wrap: wrap;
    }

    .log-stage-name { font-weight: 600; font-size: 0.9em; }
    .log-stage-pts { font-size: 0.75em; color: var(--text-muted); }

    .log-stage-input {
      display: flex;
      align-items: center;
      gap: 0.4em;
    }

    .qty-input { width: 55px !important; text-align: center; padding: 0.3em !important; }
    .qty-max { font-size: 0.8em; color: var(--text-muted); }

    /* ================================================================
       COLLECTIONS / SIDEBAR
    ================================================================ */
    .collections-layout {
      display: flex;
      gap: 0.75em;
      min-height: 100%;
    }

    .collections-sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--bg2);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6em 0.75em;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      font-size: 0.8em;
      font-family: var(--font-ui);
      font-weight: 600;
      color: var(--text-muted);
    }

    .sidebar-list { padding: 0.4em 0; }

    .sidebar-collection {
      border-bottom: 1px solid var(--border);
    }

    .sidebar-col-header {
      display: flex;
      align-items: center;
      gap: 0.4em;
      padding: 0.55em 0.75em;
      cursor: pointer;
    }

    .sidebar-col-header:hover { background: var(--surface); }
    .sidebar-collection.active > .sidebar-col-header { background: var(--surface); }

    .sidebar-col-name { flex: 1; font-size: 0.88em; font-weight: 600; }

    .sidebar-col-actions { display: flex; gap: 0.2em; opacity: 0; transition: opacity 0.2s; }
    .sidebar-collection:hover .sidebar-col-actions,
    .sidebar-list-item:hover .sidebar-col-actions { opacity: 1; }

    .sidebar-lists { padding: 0.25em 0 0.4em 0.75em; }

    .sidebar-list-item {
      display: flex;
      align-items: center;
      gap: 0.4em;
      padding: 0.35em 0.5em;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.85em;
    }

    .sidebar-list-item span { flex: 1; }
    .sidebar-list-item:hover { background: var(--surface); }
    .sidebar-list-item.active { background: var(--surface); color: var(--accent); }
    .sidebar-add-list { width: 100%; margin-top: 0.3em; font-size: 0.8em; }

    .sys-tag {
      font-size: 0.68em;
      padding: 1px 6px;
      border-radius: 10px;
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      font-family: var(--font-ui);
    }

    .sys-tag.theme-old-world { border-color: #c8962a44; color: #c8962a; }
    .sys-tag.theme-40k { border-color: #c0180c44; color: #c0180c; }
    .sys-tag.theme-heresy { border-color: #b8922a44; color: #b8922a; }
    .sys-tag.theme-aos { border-color: #9060d044; color: #9060d0; }

    .collections-main { flex: 1; min-width: 0; }

    .main-header {
      display: flex;
      align-items: center;
      gap: 0.75em;
      margin-bottom: 1em;
      flex-wrap: wrap;
    }

    .main-header h2 {
      font-family: var(--font-display);
      font-size: 1.1em;
      font-weight: 600;
      flex: 1;
    }

    /* List grid */
    .list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.75em;
    }

    .list-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9em;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
    }

    .list-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .list-card-name { font-family: var(--font-display); font-size: 0.95em; font-weight: 600; margin-bottom: 0.5em; }
    .list-card-stats { display: flex; gap: 0.75em; font-size: 0.78em; color: var(--text-muted); margin-top: 0.3em; }
    .list-card-add { border-style: dashed; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.9em; min-height: 80px; }
    .list-card-add:hover { color: var(--accent); border-color: var(--accent); }

    /* List detail */
    .list-summary {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9em;
      margin-bottom: 1em;
    }

    .threshold-row { display: flex; gap: 1em; flex-wrap: wrap; margin-top: 0.4em; }
    .thresh-item { font-size: 0.85em; color: var(--text-muted); }
    .pts-label { font-size: 0.8em; color: var(--text-muted); margin-top: 0.3em; }
    .list-models-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6em; }
    .list-models-header h3 { font-family: var(--font-display); font-size: 0.95em; }

    .list-model-row {
      display: flex;
      align-items: center;
      gap: 0.75em;
      padding: 0.65em;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 0.5em;
      cursor: pointer;
      transition: border-color 0.2s;
      flex-wrap: wrap;
    }

    .list-model-row:hover { border-color: var(--accent); }
    .list-model-info { display: flex; gap: 0.5em; align-items: baseline; flex: 1; }
    .list-model-name { font-weight: 600; font-size: 0.9em; }
    .list-model-qty { font-size: 0.78em; color: var(--text-muted); }
    .list-model-prog { flex: 1; min-width: 120px; }
    .list-model-actions { display: flex; gap: 0.3em; }

    /* --- Virtual Split --- */
    .list-model-split-group {
      margin-bottom: 0.5em;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .split-group-header {
      display: flex;
      align-items: center;
      gap: 0.5em;
      padding: 0.45em 0.65em;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .split-group-name { font-weight: 700; font-size: 0.88em; }
    .split-group-meta { font-size: 0.75em; color: var(--text-muted); }
    .list-model-split-row {
      display: flex;
      align-items: center;
      gap: 0.75em;
      padding: 0.55em 0.65em 0.55em 1.2em;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
      flex-wrap: wrap;
    }
    .list-model-split-row:last-child { border-bottom: none; }
    .list-model-split-row:hover { background: var(--surface2); }
    .list-model-split-row.split-excluded { opacity: 0.5; }
    .split-badge {
      display: inline-block;
      font-size: 0.68em;
      padding: 0.1em 0.45em;
      border-radius: 3px;
      background: var(--bg3);
      color: var(--text-muted);
      vertical-align: middle;
      margin-left: 0.35em;
    }
    /* Split modal */
    .split-modal-desc { font-size: 0.85em; color: var(--text-muted); margin-bottom: 0.8em; }
    .split-tally {
      display: flex;
      gap: 1.2em;
      font-size: 0.85em;
      margin-bottom: 0.75em;
      padding: 0.5em 0.75em;
      background: var(--surface2);
      border-radius: var(--radius);
    }
    .split-tally-over { color: var(--danger); }
    .split-rows-container { display: flex; flex-direction: column; gap: 0.4em; margin-bottom: 0.5em; }
    .split-edit-row {
      display: flex;
      align-items: center;
      gap: 0.4em;
      flex-wrap: wrap;
    }
    .split-name-inp { flex: 1; min-width: 120px; }
    .split-size-inp { width: 4.5em; flex: 0 0 auto; }
    .split-inlist-toggle { display: flex; align-items: center; gap: 0.3em; font-size: 0.82em; white-space: nowrap; cursor: pointer; }
    .split-error { color: var(--danger); font-size: 0.82em; margin-top: 0.4em; }

    .pool-filter-row {
      display: flex;
      gap: 0.5em;
      margin-bottom: 0.75em;
    }

    .pool-filter-row .form-input { flex: 1; }
    .pool-pick-folder { font-size: 0.72em; color: var(--text-muted); margin-left: auto; }

    /* Pool picker */
    .pool-picker { display: flex; flex-direction: column; gap: 0.4em; max-height: 50vh; overflow-y: auto; margin-bottom: 1em; }

    .pool-pick-item {
      display: flex;
      align-items: center;
      gap: 0.6em;
      padding: 0.5em 0.75em;
      background: var(--surface2);
      border-radius: var(--radius);
      cursor: pointer;
      border: 1px solid var(--border);
      transition: border-color 0.2s;
    }

    .pool-pick-item:hover { border-color: var(--accent); }
    .pool-pick-item.already-in { opacity: 0.5; cursor: not-allowed; }
    .pool-pick-name { flex: 1; font-size: 0.9em; }
    .pool-pick-qty { font-size: 0.8em; color: var(--text-muted); }

    /* ================================================================
       DASHBOARD
    ================================================================ */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75em;
    }

    .dash-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1em;
    }

    .dash-card h3 {
      font-family: var(--font-display);
      font-size: 0.9em;
      font-weight: 600;
      margin-bottom: 0.75em;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .dash-summary, .dash-recent { grid-column: 1 / -1; }

    .dash-pct { font-size: 2em; font-weight: 700; font-family: var(--font-display); color: var(--accent); }
    .dash-pts { font-size: 0.85em; color: var(--text-muted); margin-bottom: 0.75em; }

    .thresh-row { display: flex; gap: 1em; flex-wrap: wrap; margin: 0.75em 0; }

    .thresh-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2em;
      flex: 1;
      min-width: 60px;
    }

    .thresh-icon { font-size: 1.4em; }
    .thresh-val { font-size: 1.2em; font-weight: 700; font-family: var(--font-display); }
    .thresh-lbl { font-size: 0.72em; color: var(--text-muted); text-align: center; }
    .thresh-total { font-size: 0.8em; color: var(--text-muted); text-align: center; }

    .deadline-input-row { display: flex; align-items: center; gap: 0.5em; margin-bottom: 0.75em; flex-wrap: wrap; }
    .deadline-input-row label { font-size: 0.85em; color: var(--text-muted); white-space: nowrap; margin: 0; }
    .deadline-input-row .form-input { width: auto; flex: 1; }
    .deadline-info { font-size: 0.9em; margin-bottom: 0.5em; }
    .deadline-info.danger .danger-text { color: var(--danger); }
    .deadline-info.warning { color: var(--warning); }
    .deadline-hint { font-size: 0.85em; color: var(--text-muted); font-style: italic; }
    .pace-info { font-size: 0.9em; margin: 0.5em 0; }
    .pace-label { font-size: 0.8em; color: var(--text-muted); }

    .chart-wrap { height: 200px; position: relative; }
    .dash-chart-card { overflow: hidden; }

    .pie-mode-toggle { display: flex; gap: 0.3em; flex-shrink: 0; }
    .pie-mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .dash-army-breakdown { grid-column: 1 / -1; }
    .army-pie-grid { display: flex; flex-wrap: wrap; gap: 1rem; }
    .army-pie-card { flex: 1 1 200px; min-width: 180px; max-width: 280px; }
    .army-pie-title { font-size: 0.85em; font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .list-completion-chart { margin-top: 1rem; }
    .list-completion-chart .chart-wrap { height: 220px; }

    .dash-pile { grid-column: 1 / -1; }
    .dash-pile-burndown { grid-column: 1 / -1; }
    .dash-grey-brigade { grid-column: 1 / -1; }
    .pile-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75em; }
    .pile-card-header h3 { margin-bottom: 0; }
    .pile-total { font-size: 0.9em; color: var(--text-muted); margin-bottom: 0.75em; }
    .pile-groups { display: flex; flex-wrap: wrap; align-items: stretch; gap: 1.25rem; }
    .pile-system-group { flex: 1 1 180px; min-width: 150px; display: flex; flex-direction: column; }
    /* Pinned to the bottom of the column (via the stretch above) so every
       system's pictogram pile starts on the same shared line, regardless of
       how many text rows its item list has above it. */
    .pile-system-group .pictograph-divider { margin-top: auto; }
    .pile-system-header { display: flex; align-items: center; gap: 0.5em; margin-bottom: 0.4em; }
    .pile-system-count { font-size: 0.78em; color: var(--text-muted); }
    .pile-system-label { font-size: 0.8em; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .pile-items { display: flex; flex-direction: column; }
    .pile-item { display: flex; align-items: baseline; justify-content: space-between; font-size: 0.88em; padding: 0.22em 0; border-bottom: 1px solid var(--border); }
    .pile-item:last-child { border-bottom: none; }
    .pile-item-name { flex: 1; }
    .pile-item-qty { color: var(--text-muted); font-size: 0.88em; margin-left: 0.5em; }

    /* Quartermaster's Office */
    .qm-sys-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .qm-sys-card { display: flex; flex-direction: column; align-items: flex-start; gap: 0.3em; }
    .qm-rect-figure { font-size: 1.8em; font-weight: 700; font-family: var(--font-display); }
    .qm-rect-positive { color: var(--accent); }
    .qm-rect-negative { color: var(--danger); }
    .pile-shame-badge { display: inline-block; font-size: 0.7em; padding: 0.1em 0.45em; border-radius: 3px; margin-left: 0.5em; font-family: var(--font-ui); white-space: nowrap; vertical-align: middle; }
    .shame-fresh { background: color-mix(in srgb, var(--text-muted) 20%, transparent); color: var(--text-muted); }
    .shame-dusty { background: color-mix(in srgb, var(--warning) 25%, transparent); color: var(--warning); }
    .shame-veteran { background: color-mix(in srgb, var(--danger) 25%, transparent); color: var(--danger); }
    .shame-ancient { background: color-mix(in srgb, var(--danger) 40%, transparent); color: var(--danger); font-weight: 600; }

    .pile-total.shame-heavy { color: var(--danger); font-weight: 600; }

    /* Ledger tab: a dense transaction record, grouped by month */
    .ledger-month-group { margin-bottom: 1em; }
    .ledger-month-header { display: flex; justify-content: space-between; font-size: 0.8em; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); padding-bottom: 0.25em; margin-bottom: 0.2em; border-bottom: 1px solid var(--border); }
    .ledger-row { display: flex; align-items: baseline; gap: 0.6em; font-size: 0.88em; padding: 0.22em 0; border-bottom: 1px solid var(--border); }
    .ledger-row:last-child { border-bottom: none; }
    .ledger-row-date { flex: 0 0 3.6em; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .ledger-row-name { flex: 1; }
    .ledger-row-type { margin-left: 0.5em; font-size: 0.82em; vertical-align: middle; }
    .ledger-row-amount { flex: 0 0 auto; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .ledger-row-amount em { color: var(--text-muted); font-style: italic; font-size: 0.85em; margin-left: 0.25em; }
    .ledger-row-planned { opacity: 0.75; }

    .pictograph-divider { border: none; border-top: 1px dashed var(--border); margin: 0.75em 0 0.7em; }
    .picto-figs { display: flex; flex-wrap: wrap; gap: 3px; align-items: flex-end; }
    .fig { display: block; overflow: visible; cursor: pointer; flex-shrink: 0; stroke-width: 1; transition: transform 0.1s ease; }
    /* On touch devices, figures packed 3px apart are too close to tap
       precisely — widen the gap so each figure gets its own tappable space,
       without changing the tight desktop pile look for mouse/trackpad use. */
    @media (pointer: coarse) {
      .picto-figs { gap: 9px 7px; }
    }
    .fig:hover { stroke: var(--accent); stroke-width: 1.6; transform: translateY(-1px); }
    .fig:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* Grey Brigade figures keep the same group-color fill as Pile of Potential,
       just washed out, so the two piles still read as visually distinct. */
    .fig-grey { opacity: 0.62; }
    .fig-grp-infantry   { fill: var(--grp-infantry);   stroke: color-mix(in srgb, var(--grp-infantry) 55%, black); }
    .fig-grp-mounted    { fill: var(--grp-mounted);    stroke: color-mix(in srgb, var(--grp-mounted) 55%, black); }
    .fig-grp-large      { fill: var(--grp-large);      stroke: color-mix(in srgb, var(--grp-large) 55%, black); }
    .fig-grp-characters { fill: var(--grp-characters); stroke: color-mix(in srgb, var(--grp-characters) 55%, black); }
    .fig-grp-vehicles   { fill: var(--grp-vehicles);   stroke: color-mix(in srgb, var(--grp-vehicles) 55%, black); }
    .fig-grp-special    { fill: var(--grp-special);    stroke: color-mix(in srgb, var(--grp-special) 55%, black); }
    .fig-grp-custom     { fill: var(--grp-custom);     stroke: color-mix(in srgb, var(--grp-custom) 55%, black); }
    .fig-grp-other      { fill: var(--grp-other);      stroke: color-mix(in srgb, var(--grp-other) 55%, black); }
    .picto-overflow { font-size: 0.72em; color: var(--text-muted); border: 1px solid var(--border); border-radius: 4px; padding: 0.15em 0.4em; align-self: center; }
    .pictograph-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 0.6em; font-size: 0.78em; color: var(--text-muted); margin-top: 0.85em; }
    .picto-legend-item { display: inline-flex; align-items: center; gap: 0.3em; }
    .picto-legend-size-note { font-style: italic; }

    .session-list { display: flex; flex-direction: column; gap: 0.5em; }
    .session-item { padding: 0.5em; background: var(--surface2); border-radius: var(--radius); font-size: 0.85em; }
    .session-date { font-weight: 700; color: var(--accent); }
    .session-detail { color: var(--text-muted); font-size: 0.9em; margin: 0.2em 0; }
    .session-tag { display: inline-block; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 0.8em; margin: 2px; }

    /* ================================================================
       DETAIL / MODAL
    ================================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .modal-overlay.visible { opacity: 1; }

    .modal-box {
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-width: 520px;
      max-height: 90dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      transform: translateY(20px);
      transition: transform 0.25s ease;
      border: 1px solid var(--border);
      border-bottom: none;
    }

    .modal-overlay.visible .modal-box { transform: translateY(0); }
    .modal-wide { max-width: 680px; }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9em 1em;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 1;
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 1em;
      font-weight: 600;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1em;
      cursor: pointer;
      padding: 0.2em;
    }

    .modal-body { padding: 1em; }
    .modal-actions { display: flex; gap: 0.5em; margin-top: 1.25em; flex-wrap: wrap; }

    .detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5em; }
    .detail-qty { font-size: 0.9em; margin-bottom: 0.25em; }
    .detail-notes { font-size: 0.85em; color: var(--text-muted); font-style: italic; }
    .detail-pts { font-size: 0.85em; color: var(--text-muted); margin-bottom: 0.75em; }

    /* ================================================================
       TOASTS
    ================================================================ */
    .toast-container {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 0.4em;
      pointer-events: none;
    }

    .toast {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5em 1.2em;
      border-radius: 100px;
      font-size: 0.85em;
      font-family: var(--font-ui);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s, transform 0.25s;
      white-space: nowrap;
    }

    .toast.visible { opacity: 1; transform: translateY(0); }
    .toast-success { border-color: var(--accent); color: var(--accent); }
    .toast-error   { border-color: var(--danger); color: var(--danger); }
    .toast-info    { border-color: var(--border); }

    /* ================================================================
       EMPTY STATES
    ================================================================ */
    .empty-state {
      text-align: center;
      padding: 2.5em 1em;
      color: var(--text-muted);
    }

    .empty-state p { margin-bottom: 1em; font-size: 0.95em; }
    .empty-text { font-size: 0.85em; color: var(--text-muted); font-style: italic; }

    /* Onboarding card (first-run empty states) */
    .onboarding-card {
      max-width: 520px;
      margin: 2em auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2em 1.75em;
    }
    .onboarding-title { font-family: var(--font-display); font-size: 1.3em; margin-bottom: 0.5em; }
    .onboarding-desc { color: var(--text-muted); font-size: 0.9em; margin-bottom: 1.25em; }
    .onboarding-steps { display: flex; flex-direction: column; gap: 1em; margin-bottom: 1.5em; }
    .onboarding-step { display: flex; gap: 0.9em; align-items: flex-start; }
    .onboarding-step .step-num {
      flex-shrink: 0;
      width: 1.6em; height: 1.6em;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8em; font-weight: bold;
    }
    .onboarding-step div { line-height: 1.4; }
    .onboarding-step b { display: block; margin-bottom: 0.15em; }
    .onboarding-step p { margin: 0; font-size: 0.85em; color: var(--text-muted); }
    .onboarding-cta { margin-top: 0.5em; }

    /* Army nudge banner */
    .army-nudge {
      display: flex; align-items: center; gap: 0.75em;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 0.7em 1em;
      margin-bottom: 1em;
      font-size: 0.88em;
    }
    .army-nudge-icon { font-size: 1.3em; flex-shrink: 0; }
    .army-nudge-body { flex: 1; line-height: 1.4; }
    .army-nudge-body b { display: block; margin-bottom: 0.1em; }
    .army-nudge-body span { color: var(--text-muted); }

    /* Stage done indicator in Log Progress */
    .stage-done { opacity: 0.55; }
    .stage-done-badge { font-size: 0.78em; color: var(--accent); font-weight: bold; margin-left: 0.3em; }

    /* Weekly goal nudge */
    .weekly-goal-nudge { margin-bottom: 0.5em; }
    .goal-nudge-text { font-size: 0.82em; color: var(--text-muted); margin-bottom: 0.5em; }

    /* Log time hint */
    .log-time-hint { margin-top: 0.25em; }

    /* ================================================================
       SETTINGS PANEL
    ================================================================ */
    .settings-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1em;
      margin-bottom: 0.75em;
    }

    .settings-section h3 {
      font-family: var(--font-display);
      font-size: 0.9em;
      font-weight: 600;
      margin-bottom: 0.75em;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1em;
      padding: 0.4em 0;
      border-bottom: 1px solid var(--border);
    }

    .settings-row:last-child { border-bottom: none; }
    .settings-row-label { font-size: 0.9em; }
    .settings-row-desc { font-size: 0.78em; color: var(--text-muted); }
    .type-customised-badge {
      display: inline-block;
      font-size: 0.7em;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--accent-dim, #1a2e20);
      color: var(--accent, #4a9d6f);
      border: 1px solid var(--accent, #4a9d6f44);
      vertical-align: middle;
      margin-left: 0.4em;
      font-weight: normal;
    }

    .model-type-row {
      display: flex;
      gap: 0.5em;
      align-items: center;
    }

    .model-type-row .form-input { flex: 1; }

    .model-type-manage { margin-top: 0.4em; }

    .type-manage-row {
      display: flex;
      align-items: center;
      gap: 0.5em;
      padding: 0.35em 0.6em;
      background: var(--surface2);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .type-manage-name { flex: 1; font-size: 0.85em; color: var(--text-muted); }

    .form-hint { font-size: 0.78em; color: var(--text-muted); font-weight: normal; font-style: italic; }

    .date-dropdowns {
      display: flex;
      gap: 0.4em;
    }

    .date-dropdowns .form-input {
      flex: 1;
      min-width: 0;
      padding-left: 0.4em;
      padding-right: 0.4em;
    }

    .date-dropdowns .date-yy { flex: 1.3; }

    .time-dropdowns {
      display: flex;
      gap: 0.3em;
      align-items: center;
      flex: 1;
    }

    .time-dropdowns .form-input {
      flex: 1;
      min-width: 0;
      padding-left: 0.4em;
      padding-right: 0.4em;
    }

    .time-sep {
      font-weight: bold;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .time-range-row {
      display: flex;
      align-items: center;
      gap: 0.4em;
    }

    .time-range-arrow {
      flex-shrink: 0;
      color: var(--text-muted);
      font-size: 0.9em;
    }

    input[type="time"].form-input {
      flex: 1;
    }

    /* ================================================================
       DEADLINE CARDS
    ================================================================ */
    .dash-deadlines { grid-column: 1 / -1; }

    .deadline-cards { display: flex; flex-direction: column; gap: 0.6em; }

    .deadline-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75em;
    }

    .urgency-overdue  { border-left-color: var(--danger); }
    .urgency-soon     { border-left-color: var(--warning); }
    .urgency-upcoming { border-left-color: var(--accent2); }

    .deadline-card-header { display: flex; align-items: center; gap: 0.5em; margin-bottom: 0.3em; }
    .deadline-card-name { font-weight: 600; font-family: var(--font-display); font-size: 0.95em; flex: 1; }
    .deadline-card-date { font-size: 0.82em; color: var(--text-muted); margin-bottom: 0.4em; }
    .deadline-days { font-weight: 600; color: var(--text); }
    .deadline-card-stats { display: flex; justify-content: space-between; align-items: center; font-size: 0.82em; color: var(--text-muted); margin: 0.3em 0 0.5em; }

    .pace-badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 2px 8px;
      font-size: 0.8em;
      color: var(--accent);
      white-space: nowrap;
    }

    /* ================================================================
       WEEKLY SUMMARY
    ================================================================ */
    .dash-weekly { grid-column: 1 / -1; }

    .weekly-day-dots {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.85em;
    }

    .week-dot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25em;
      flex: 1;
    }

    .week-dot-circle {
      width: 1.8em;
      height: 1.8em;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      transition: all 0.2s;
    }

    .week-dot.painted .week-dot-circle {
      background: var(--accent);
      border-color: var(--accent);
    }

    .week-dot.today .week-dot-circle {
      border-color: var(--accent2);
    }

    .week-dot.today.painted .week-dot-circle {
      box-shadow: 0 0 0 2px var(--accent2);
    }

    .week-dot-label {
      font-size: 0.65em;
      color: var(--text-muted);
      font-family: var(--font-ui);
    }

    .week-dot.today .week-dot-label { color: var(--accent2); font-weight: 700; }

    .weekly-stats {
      display: flex;
      gap: 0.5em;
      margin-bottom: 0.75em;
    }

    .weekly-stat {
      flex: 1;
      background: var(--surface2);
      border-radius: var(--radius);
      padding: 0.5em 0.25em;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.1em;
    }

    .weekly-stat-val { font-size: 1.1em; font-weight: 700; font-family: var(--font-display); color: var(--accent); }
    .weekly-stat-lbl { font-size: 0.65em; color: var(--text-muted); }

    .weekly-goal-row { margin-bottom: 0.5em; }
    .weekly-goal-label { font-size: 0.82em; color: var(--text-muted); margin-bottom: 0.3em; }
    .weekly-goal-bar { height: 10px; }
    .prog-fill.goal-done { background: #4a9d6f; }
    .prog-fill.goal-close { background: var(--accent2); }

    .weekly-goal-set { margin-bottom: 0.5em; }
    .weekly-message { font-size: 0.85em; color: var(--text-muted); font-style: italic; margin-top: 0.4em; }

    /* ================================================================
       HOBBY STATS
    ================================================================ */
    .dash-hobby-stats { grid-column: 1 / -1; }

    .hobby-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75em;
    }

    @media (max-width: 600px) {
      .hobby-stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .hobby-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25em;
      padding: 0.75em 0.5em;
      background: var(--surface2);
      border-radius: var(--radius);
      text-align: center;
    }

    .hobby-stat-icon { font-size: 1.5em; }
    .hobby-stat-val { font-size: 1em; font-weight: 700; font-family: var(--font-display); color: var(--accent); word-break: break-word; }
    .hobby-stat-lbl { font-size: 0.72em; color: var(--text-muted); }

    /* ================================================================
       ACTIVITY CALENDAR
    ================================================================ */
    .activity-layout {
      display: flex;
      flex-direction: column;
      gap: 0.75em;
    }

    .activity-calendar-card h3,
    .activity-history-card h3 {
      font-family: var(--font-display);
      font-size: 0.9em;
      font-weight: 600;
      margin-bottom: 0.75em;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .activity-calendar-card,
    .activity-history-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1em;
    }

    .cal-summary {
      display: flex;
      gap: 0.5em;
      font-size: 0.82em;
      color: var(--text-muted);
      margin-bottom: 0.75em;
      flex-wrap: wrap;
    }

    .cal-outer {
      display: flex;
      align-items: flex-start;
      gap: 0.4em;
    }

    .cal-wrap {
      overflow-x: auto;
      padding-bottom: 0.25em;
      flex: 1;
      min-width: 0;
    }

    .cal-day-labels {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-top: 1.4em;
      flex-shrink: 0;
    }

    .cal-day-label {
      height: 12px;
      font-size: 0.6em;
      color: var(--text-muted);
      line-height: 12px;
      width: 2.5em;
      text-align: left;
      padding-left: 0.3em;
    }

    .cal-grid-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .cal-month-labels {
      display: grid;
      grid-template-columns: repeat(53, 14px);
      height: 1.2em;
      position: relative;
    }

    .cal-month-label {
      font-size: 0.65em;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .cal-grid {
      display: flex;
      gap: 2px;
    }

    .cal-week {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .cal-day {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    .cal-day:hover { opacity: 0.75; }

    .cal-intensity-0 { background: var(--surface2); }
    .cal-intensity-1 { background: color-mix(in srgb, var(--accent) 30%, var(--surface2)); }
    .cal-intensity-2 { background: color-mix(in srgb, var(--accent) 55%, var(--surface2)); }
    .cal-intensity-3 { background: color-mix(in srgb, var(--accent) 75%, var(--surface2)); }
    .cal-intensity-4 { background: var(--accent); }

    .cal-legend {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 0.6em;
      font-size: 0.72em;
      color: var(--text-muted);
    }

    .cal-legend .cal-day { cursor: default; }

    /* Session history */
    .history-month { margin-bottom: 1em; }

    .history-month-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.4em;
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 0.5em;
    }

    .history-month-label { font-weight: 700; font-family: var(--font-display); font-size: 0.95em; }
    .history-month-stats { font-size: 0.78em; color: var(--text-muted); }

    .session-item {
      padding: 0.5em 0.6em;
      background: var(--surface2);
      border-radius: var(--radius);
      margin-bottom: 0.4em;
      font-size: 0.85em;
    }

    .session-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.2em; }
    .session-item-right { display: flex; align-items: center; gap: 0.5em; }
    .session-dur { font-size: 0.85em; color: var(--text-muted); }
    .session-notes { font-size: 0.82em; color: var(--text-muted); font-style: italic; margin-top: 0.2em; }
    .session-delete { padding: 0.1em 0.4em; font-size: 0.8em; line-height: 1.4; }

    /* ================================================================
       QUEUES
    ================================================================ */
    .queue-layout { display: flex; flex-direction: column; gap: 0; }

    .queue-tabs-bar {
      display: flex;
      align-items: center;
      gap: 0.5em;
      margin-bottom: 1em;
      flex-wrap: wrap;
    }

    .queue-tab-list {
      display: flex;
      gap: 0.4em;
      flex-wrap: wrap;
      flex: 1;
    }

    .queue-tab-btn {
      padding: 0.35em 0.85em;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 0.85em;
      cursor: pointer;
      font-family: var(--font-ui);
      transition: all 0.15s;
    }

    .queue-tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .queue-tab-btn:hover:not(.active) { color: var(--text); border-color: var(--text-muted); }

    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1em;
      gap: 0.5em;
      flex-wrap: wrap;
    }

    .queue-name {
      font-family: var(--font-display);
      font-size: 1.1em;
      font-weight: 600;
    }

    .queue-header-actions { display: flex; gap: 0.4em; }

    .queue-entries { display: flex; flex-direction: column; gap: 0.6em; }

    .queue-entry {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75em;
      transition: border-color 0.2s;
    }

    .queue-entry-next {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 6%, var(--surface));
    }

    .queue-up-next-label {
      font-size: 0.75em;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.4em;
      font-family: var(--font-ui);
    }

    .queue-entry-main { display: flex; flex-direction: column; gap: 0.4em; }

    .queue-entry-info {
      display: flex;
      align-items: center;
      gap: 0.5em;
      flex-wrap: wrap;
    }

    .queue-entry-name { font-weight: 600; font-family: var(--font-display); flex: 1; }
    .queue-entry-qty { font-size: 0.8em; color: var(--text-muted); }
    .queue-entry-note { font-size: 0.82em; color: var(--text-muted); font-style: italic; }

    .queue-entry-actions {
      display: flex;
      gap: 0.4em;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 0.2em;
    }

    .queue-move-btns { display: flex; gap: 0.2em; }
    .queue-move-btns .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ================================================================
       FOLDERS
    ================================================================ */
    .folder-section {
      margin-bottom: 0.75em;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .folder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5em 0.75em;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      gap: 0.5em;
    }

    .folder-toggle {
      display: flex;
      align-items: center;
      gap: 0.5em;
      flex: 1;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 0.9em;
      text-align: left;
      padding: 0;
    }

    .folder-chevron { font-size: 0.7em; color: var(--text-muted); width: 0.8em; }
    .folder-icon { font-size: 1em; }
    .folder-name { font-weight: 600; font-family: var(--font-display); flex: 1; }
    .folder-count {
      font-size: 0.72em;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 1px 7px;
      color: var(--text-muted);
    }

    .folder-actions { display: flex; gap: 0.3em; align-items: center; }
    .folder-models { padding: 0.75em; background: var(--bg); }
    .folder-empty { font-size: 0.85em; color: var(--text-muted); font-style: italic; padding: 0.25em 0; }
    .folder-unfiled .folder-header { background: var(--bg2); }

    /* ================================================================
       ROADMAP TAB
    ================================================================ */
    .roadmap-intro { color: var(--text-muted); font-size: 0.88em; margin: -0.3em 0 1.25em; }
    .roadmap-campaigns { display: flex; flex-direction: column; gap: 0.75em; margin-bottom: 1.5em; }
    .roadmap-campaign-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9em 1em; }
    .roadmap-campaign-header { display: flex; align-items: center; gap: 0.6em; flex-wrap: wrap; margin-bottom: 0.5em; }
    .roadmap-campaign-name { font-family: var(--font-display); font-weight: 600; font-size: 1em; }
    .roadmap-deadline { font-size: 0.8em; color: var(--text-muted); margin-left: auto; }
    .roadmap-campaign-actions { display: flex; align-items: center; gap: 0.5em; margin-top: 0.6em; flex-wrap: wrap; }
    .roadmap-move-btns { display: flex; gap: 0.2em; }
    .roadmap-move-btns .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .roadmap-add-section { margin-top: 1em; }
    .roadmap-add-section h3 { font-family: var(--font-display); font-size: 1em; margin-bottom: 0.6em; }
    .roadmap-available-list { display: flex; flex-direction: column; gap: 0.4em; }
    .roadmap-available-row { display: flex; align-items: center; gap: 0.6em; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.5em 0.75em; flex-wrap: wrap; }
    .roadmap-available-name { font-weight: 600; }
    .roadmap-available-count { font-size: 0.8em; color: var(--text-muted); margin-left: auto; }

    .roadmap-campaign-models { margin-top: 0.75em; padding-top: 0.6em; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.4em; }
    .roadmap-model-row { display: flex; align-items: center; gap: 0.6em; cursor: pointer; padding: 0.3em 0; }
    .roadmap-model-row:hover .roadmap-model-name { color: var(--accent); }
    .roadmap-model-name { flex: 0 0 auto; font-size: 0.88em; }
    .roadmap-model-qty { color: var(--text-muted); font-size: 0.85em; }
    .roadmap-model-row .prog-bar { flex: 1; }
    .roadmap-finished-toggle { align-self: flex-start; background: none; border: none; color: var(--text-muted); padding: 0.2em 0; }
    .roadmap-finished-toggle:hover { color: var(--text); }
    .roadmap-finished-list { display: flex; flex-direction: column; gap: 0.4em; opacity: 0.75; }

    /* ================================================================
       POOL SELECT MODE / MASS MOVE
    ================================================================ */
    .pool-select-controls {
      display: flex;
      align-items: center;
      gap: 0.4em;
      padding: 0.4em 0.5em;
      margin-bottom: 0.5em;
    }

    .mass-move-bar {
      display: flex;
      align-items: center;
      gap: 0.5em;
      padding: 0.5em 0.75em;
      background: var(--bg2);
      border: 1px solid var(--accent);
      border-radius: 8px;
      margin-bottom: 0.75em;
      flex-wrap: wrap;
    }
    .mass-move-label { font-size: 0.85em; font-weight: 600; white-space: nowrap; }
    .mass-move-select { flex: 1; min-width: 8em; max-width: 16em; font-size: 0.85em; padding: 0.25em 0.4em; }

    .model-card-selectable {
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    .model-card-selectable:hover { border-color: var(--accent); }
    .model-card-selected { border-color: var(--accent) !important; background: color-mix(in srgb, var(--accent) 12%, var(--bg2)); }
    .model-select-check {
      font-size: 1.15em;
      margin-bottom: 0.2em;
      color: var(--accent);
    }

    /* ================================================================
       FLOATING ACTION BUTTON
    ================================================================ */
    .fab {
      position: fixed;
      bottom: calc(4.5em + env(safe-area-inset-bottom));
      right: 1.25em;
      width: 2.6em;
      height: 2.6em;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, black));
      border: none;
      color: #fff;
      font-size: 1.3em;
      font-weight: 300;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: transform 0.15s, opacity 0.15s;
    }

    .fab:hover { transform: scale(1.08); }
    .fab:active { transform: scale(0.95); }

    /* Hide FAB when not on models tab */
    .tab-panel:not(.active) .fab { display: none; }

    .log-quick-btns {
      display: flex;
      gap: 0.5em;
      margin-bottom: 0.6em;
    }

    .log-stage-check {
      display: flex;
      align-items: center;
      gap: 0.75em;
      padding: 0.6em 0.75em;
      background: var(--surface2);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
    }

    .log-stage-check:hover { border-color: var(--accent); }

    .log-stage-check input[type=checkbox] {
      width: 1.2em;
      height: 1.2em;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .log-stage-check .log-stage-name { flex: 1; font-weight: 600; font-size: 0.9em; }
    .log-stage-check .log-stage-pts { font-size: 0.78em; color: var(--text-muted); }

    .log-stage-check.is-done {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, var(--surface2));
    }

    .form-row-two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75em;
    }

    @media (max-width: 400px) {
      .form-row-two { grid-template-columns: 1fr; }
    }

    .share-text-area {
      font-family: monospace;
      font-size: 0.82em;
      line-height: 1.6;
      white-space: pre;
      resize: none;
    }

    .pace-done { color: #4a9d6f; }

    .list-deadline-row {
      display: flex;
      align-items: center;
      gap: 0.5em;
      margin-top: 0.6em;
      flex-wrap: wrap;
    }

    .list-deadline-row label { font-size: 0.82em; color: var(--text-muted); white-space: nowrap; }
    .list-deadline-row .date-dropdowns,
    .list-deadline-row input[type=date] { flex: 1; min-width: 0; }

    .burndown-summary { margin-bottom: 0.75em; }
    .burndown-stats { display: flex; flex-wrap: wrap; gap: 0.75em; font-size: 0.82em; color: var(--text-muted); margin-top: 0.3em; }
    .burndown-chart-tabs { display: flex; gap: 0.4em; margin-bottom: 0.75em; }
    .burndown-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .chart-wrap-tall { height: 260px; }

    @media (max-width: 600px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .dash-summary, .dash-recent { grid-column: 1; }

      .collections-layout { flex-direction: column; }
      .collections-sidebar { width: 100%; }

      .model-grid { grid-template-columns: 1fr; }

      .modal-box { border-radius: var(--radius) var(--radius) 0 0; }
    }

    @media (min-width: 601px) {
      .modal-overlay { align-items: center; }
      .modal-box { border-radius: var(--radius); border: 1px solid var(--border); }
    }

  </style>
</head>
